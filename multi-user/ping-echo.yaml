name: Ping Echo Server
entryKey: multi-user-ping-echo
shortDescription: Containerized multi-user MCP server with ping/pong and echo tools
description: |
  A demo multi-user MCP server template. Provides two tools:
  - ping: returns "pong" with the container hostname (useful for verifying shared-instance behavior)
  - echo: echoes a message, optionally prefixed by the GREETING env var

  Demonstrates containerized multi-user server templates with:
  - Header configuration (X-User-Token)
  - Server-level env vars (GREETING, SECRET_KEY)
runtime: containerized
containerizedConfig:
  image: ghcr.io/calvinmclean/mcp-ping-echo:main
  port: 8080
  path: /mcp
  startupTimeoutSeconds: 30
config:
  - name: X-User-Token
    usage: header
    key: X-User-Token
    description: Authentication token passed with each request to the server
    sensitive: true
    required: false
  - name: GREETING
    usage: env
    key: GREETING
    description: Prefix added to every echo tool response (e.g. "Hello")
    required: true
  - name: SECRET_KEY
    usage: env
    key: SECRET_KEY
    description: Sensitive value to demonstrate secret env var handling
    sensitive: true
    required: false
  - name: GREETING_TWO
    usage: env
    key: GREETING_TWO
    description: optional for diff
    required: false
  - name: GREETING_THREE
    usage: env
    key: GREETING_THREE
    description: optional for diff
    required: false
